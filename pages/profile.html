<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Dashboard — FreshBasket Supermarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { 600: '#16a34a' } } } } }
  </script>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/dark-mode.css" />
  <link rel="stylesheet" href="../assets/css/rtl.css" />
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 transition-colors duration-200">

  <!-- TOP BAR & HEADER -->
  <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 py-4">
    <div class="max-w-7xl mx-auto px-4 flex items-center justify-between">
      <a href="../index.html" class="flex items-center gap-2">
        <div class="w-9 h-9 bg-green-600 text-white rounded-xl flex items-center justify-center font-extrabold text-lg">
          <i class="fa-solid fa-basket-shopping"></i>
        </div>
        <span class="font-extrabold text-xl dark:text-white">Fresh<span class="text-green-600">Basket</span> Dashboard</span>
      </a>
      <div class="flex items-center gap-4">
        <button class="rtl-toggle-btn text-xs font-semibold px-2 py-1 bg-slate-200 dark:bg-slate-700 rounded">RTL</button>
        <button class="theme-toggle-btn text-sm p-1"><i class="fa-solid fa-moon"></i></button>
        <a href="login.html" class="text-xs font-bold text-red-500 hover:underline">Log Out</a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      
      <!-- DASHBOARD SIDEBAR -->
      <aside class="lg:col-span-3">
        <div class="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 p-6 space-y-6 shadow-sm">
          
          <div class="flex items-center gap-4 pb-6 border-b border-slate-100 dark:border-slate-700">
            <img class="w-12 h-12 rounded-full object-cover border-2 border-green-600" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" alt="User Avatar" />
            <div>
              <h3 class="font-bold text-slate-900 dark:text-white text-base">Sarah Jenkins</h3>
              <span class="text-xs text-green-600 font-semibold"><i class="fa-solid fa-shield-halved mr-1"></i> VIP Fresh Member</span>
            </div>
          </div>

          <nav class="space-y-1 text-sm font-semibold">
            <a href="profile.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl bg-green-600 text-white shadow-md shadow-green-600/20">
              <i class="fa-solid fa-user-circle"></i> Profile & Overview
            </a>
            <a href="orders.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">
              <i class="fa-solid fa-clock-rotate-left"></i> Order History
            </a>
            <a href="shopping-lists.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">
              <i class="fa-solid fa-list-check"></i> Saved Grocery Lists
            </a>
            <a href="wishlist.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">
              <i class="fa-regular fa-heart"></i> My Wishlist
            </a>
            <a href="addresses.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">
              <i class="fa-solid fa-map-location-dot"></i> Saved Addresses
            </a>
            <a href="payments.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">
              <i class="fa-solid fa-credit-card"></i> Payment Methods
            </a>
            <a href="notifications.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">
              <i class="fa-solid fa-bell"></i> Notifications
            </a>
          </nav>
        </div>
      </aside>

      <!-- MAIN CONTENT TAB -->
      <section class="lg:col-span-9 space-y-6">
        
        <!-- Welcome Stats -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
          <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm">
            <span class="text-xs text-slate-400 font-semibold block mb-1">Total Grocery Orders</span>
            <span class="text-3xl font-extrabold text-slate-900 dark:text-white">24</span>
          </div>

          <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm">
            <span class="text-xs text-slate-400 font-semibold block mb-1">Fresh Points Earned</span>
            <span class="text-3xl font-extrabold text-green-600">1,420 pts</span>
          </div>

          <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm">
            <span class="text-xs text-slate-400 font-semibold block mb-1">Default Address</span>
            <span class="text-sm font-bold text-slate-900 dark:text-white block truncate">742 Evergreen Terrace</span>
          </div>
        </div>

        <!-- Profile Settings Form -->
        <div class="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 p-8 shadow-sm space-y-6">
          <h2 class="text-xl font-bold text-slate-900 dark:text-white pb-4 border-b border-slate-100 dark:border-slate-700">Personal Information</h2>
          
          <form class="space-y-4" onsubmit="event.preventDefault(); window.showToast('Profile updated!', 'success');">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">First Name</label>
                <input type="text" value="Sarah" class="w-full p-3 bg-slate-100 dark:bg-slate-900 border-none rounded-xl text-sm dark:text-white" />
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Last Name</label>
                <input type="text" value="Jenkins" class="w-full p-3 bg-slate-100 dark:bg-slate-900 border-none rounded-xl text-sm dark:text-white" />
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Email Address</label>
                <input type="email" value="sarah.jenkins@example.com" class="w-full p-3 bg-slate-100 dark:bg-slate-900 border-none rounded-xl text-sm dark:text-white" />
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Phone Number</label>
                <input type="tel" value="(555) 234-5678" class="w-full p-3 bg-slate-100 dark:bg-slate-900 border-none rounded-xl text-sm dark:text-white" />
              </div>
            </div>

            <button type="submit" class="btn-primary px-8 py-3 text-sm font-bold">Save Changes</button>
          </form>
        </div>

      </section>
    </div>
  </main>

  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
