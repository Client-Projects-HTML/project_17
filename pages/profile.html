<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile — FreshBasket Supermarket</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg" />
  <link rel="shortcut icon" href="../favicon.svg" />
  <link rel="apple-touch-icon" href="../assets/images/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { 600: '#16a34a' } } } } }
  </script>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/dark-mode.css" />
  <link rel="stylesheet" href="../assets/css/rtl.css" />
  <script>
    if (localStorage.getItem('freshbasket_logged_in') === 'false') {
      window.location.href = 'login.html';
    }
  </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 transition-colors duration-200">

  <!-- TOP BAR & HEADER -->
  <header class="sticky top-0 z-50 w-full shadow-sm bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 py-2.5 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 flex items-center justify-between">
      <a href="../index.html" class="flex items-center gap-2">
        <div class="w-9 h-9 bg-green-600 text-white rounded-xl flex items-center justify-center font-extrabold text-lg shadow-sm">
          <i class="fa-solid fa-basket-shopping"></i>
        </div>
        <span class="font-extrabold text-xl dark:text-white">Fresh<span class="text-green-600">Basket</span> Dashboard</span>
      </a>
      <div class="flex items-center gap-4">
        <button type="button" onclick="event.preventDefault(); event.stopPropagation(); event.stopImmediatePropagation(); if(window.themeController) window.themeController.toggleRTL(); return false;" class="rtl-toggle-btn w-8 h-8 flex items-center justify-center bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-600 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors" title="Toggle RTL/LTR" aria-label="Toggle RTL/LTR"><i class="fa-solid fa-globe text-sm"></i></button>
        <button type="button" onclick="event.preventDefault(); event.stopPropagation(); event.stopImmediatePropagation(); if(window.themeController) window.themeController.toggleDarkMode(); return false;" class="theme-toggle-btn text-sm p-1"><i class="fa-solid fa-moon"></i></button>
        <button onclick="logoutUser()" class="text-xs font-bold px-3.5 py-1.5 bg-red-50 text-red-600 hover:bg-red-600 hover:text-white dark:bg-red-950/40 dark:text-red-400 dark:hover:bg-red-600 dark:hover:text-white border border-red-200 dark:border-red-800/60 rounded-full transition-colors flex items-center gap-1.5 shadow-sm">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      
      <!-- DASHBOARD SIDEBAR -->
      <aside class="lg:col-span-3">
        <div class="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 p-6 space-y-6 shadow-sm">
          
          <div class="flex items-center gap-4 pb-6 border-b border-slate-100 dark:border-slate-700">
            <img class="w-12 h-12 rounded-full object-cover border-2 border-green-600 shadow-sm" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" alt="User Avatar" />
            <div>
              <h3 class="font-bold text-slate-900 dark:text-white text-base">Sarah Jenkins</h3>
              <span class="text-xs text-green-600 font-semibold"><i class="fa-solid fa-shield-halved mr-1"></i> VIP Fresh Member</span>
            </div>
          </div>

          <nav class="space-y-1 text-xs font-bold">
            <a href="../user/index.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-green-700 dark:text-green-400 bg-green-50 dark:bg-green-950/40 hover:bg-green-100 transition-colors">
              <i class="fa-solid fa-gauge-high text-sm"></i> User Dashboard
            </a>
            <a href="profile.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl bg-green-600 text-white shadow-md shadow-green-600/20">
              <i class="fa-solid fa-user-circle text-sm"></i> Profile & Overview
            </a>
            <a href="orders.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
              <i class="fa-solid fa-clock-rotate-left text-sm"></i> Order History
            </a>
            <a href="shopping-lists.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
              <i class="fa-solid fa-list-check text-sm"></i> Saved Grocery Lists
            </a>
            <a href="wishlist.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
              <i class="fa-regular fa-heart text-sm"></i> My Wishlist
            </a>
            <a href="addresses.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
              <i class="fa-solid fa-map-location-dot text-sm"></i> Saved Addresses
            </a>
            <a href="payments.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
              <i class="fa-solid fa-credit-card text-sm"></i> Payment Methods
            </a>
            <a href="notifications.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
              <i class="fa-solid fa-bell text-sm"></i> Notifications
            </a>

            <hr class="border-slate-100 dark:border-slate-700 my-2" />

            <button onclick="logoutUser()" class="w-full flex items-center gap-3 px-4 py-3 rounded-2xl bg-red-50 text-red-600 hover:bg-red-600 hover:text-white dark:bg-red-950/40 dark:text-red-400 dark:hover:bg-red-600 dark:hover:text-white transition-colors text-left font-bold text-xs shadow-sm">
              <i class="fa-solid fa-right-from-bracket text-sm"></i> Logout
            </button>
          </nav>
        </div>
      </aside>

      <!-- MAIN CONTENT TAB -->
      <section class="lg:col-span-9 space-y-6">
        
        <!-- Welcome Stats -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
          <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm">
            <span class="text-xs text-slate-400 font-semibold block mb-1">Total Grocery Orders</span>
            <span class="text-3xl font-extrabold text-slate-900 dark:text-white">24</span>
          </div>

          <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm">
            <span class="text-xs text-slate-400 font-semibold block mb-1">Fresh Points Earned</span>
            <span class="text-3xl font-extrabold text-green-600">1,420 pts</span>
          </div>

          <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm">
            <span class="text-xs text-slate-400 font-semibold block mb-1">Default Address</span>
            <span class="text-sm font-bold text-slate-900 dark:text-white block truncate">742 Evergreen Terrace</span>
          </div>
        </div>

        <!-- Profile Settings Form -->
        <div class="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 p-8 shadow-sm space-y-6">
          <h2 class="text-xl font-bold text-slate-900 dark:text-white pb-4 border-b border-slate-100 dark:border-slate-700">Personal Information</h2>
          
          <form class="space-y-4" onsubmit="event.preventDefault(); if(window.showToast) window.showToast('Profile updated!', 'success');">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">First Name</label>
                <input type="text" value="Sarah" class="w-full p-3 bg-slate-100 dark:bg-slate-900 border-none rounded-xl text-sm dark:text-white" />
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Last Name</label>
                <input type="text" value="Jenkins" class="w-full p-3 bg-slate-100 dark:bg-slate-900 border-none rounded-xl text-sm dark:text-white" />
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Email Address</label>
              <input type="email" value="sarah.jenkins@example.com" class="w-full p-3 bg-slate-100 dark:bg-slate-900 border-none rounded-xl text-sm dark:text-white" />
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Phone Number</label>
              <input type="tel" value="(555) 234-5678" class="w-full p-3 bg-slate-100 dark:bg-slate-900 border-none rounded-xl text-sm dark:text-white" />
            </div>

            <button type="submit" class="btn-primary py-3 px-6 text-xs font-bold shadow-md shadow-green-600/20">Save Profile Changes</button>
          </form>
        </div>

      </section>

    </div>
  </main>

  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/dashboard.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
