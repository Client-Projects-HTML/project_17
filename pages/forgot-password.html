<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — FreshBasket Supermarket</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg" />
  <link rel="shortcut icon" href="../favicon.svg" />
  <link rel="apple-touch-icon" href="../assets/images/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { 600: '#16a34a' } } } } }
  </script>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/dark-mode.css" />
  <link rel="stylesheet" href="../assets/css/rtl.css" />
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col justify-between">

  <header class="py-4 px-4 max-w-7xl mx-auto w-full flex items-center justify-between">
    <a href="../index.html" class="inline-flex items-center gap-2 px-4 py-2 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors shadow-sm font-bold text-xs sm:text-sm">
      <i class="fa-solid fa-arrow-left text-xs"></i>
      <span>Back to Home</span>
    </a>
    <div></div>
  </header>

  <main class="max-w-md mx-auto w-full px-4 py-8">
    <div class="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 p-8 shadow-xl space-y-6">
      
      <!-- Card Top Header Controls -->
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-700/60">
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 bg-green-600 text-white rounded-lg flex items-center justify-center font-extrabold text-xs shadow-sm">
            <i class="fa-solid fa-basket-shopping"></i>
          </div>
          <span class="font-extrabold text-sm text-slate-900 dark:text-white">Fresh<span class="text-green-600">Basket</span></span>
        </div>
        <div class="flex items-center gap-2">
          <button type="button" onclick="event.preventDefault(); event.stopPropagation(); event.stopImmediatePropagation(); if(window.themeController) window.themeController.toggleDarkMode(); return false;" class="theme-toggle-btn w-8 h-8 flex items-center justify-center bg-slate-100 dark:bg-slate-700/60 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-600 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors" title="Toggle Light/Dark Theme" aria-label="Toggle Light/Dark Theme">
            <i class="fa-solid fa-moon text-xs"></i>
          </button>
          <button type="button" onclick="event.preventDefault(); event.stopPropagation(); event.stopImmediatePropagation(); if(window.themeController) window.themeController.toggleRTL(); return false;" class="rtl-toggle-btn w-8 h-8 flex items-center justify-center bg-slate-100 dark:bg-slate-700/60 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-600 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors" title="Toggle RTL/LTR" aria-label="Toggle RTL/LTR">
            <i class="fa-solid fa-right-left text-xs"></i>
          </button>
        </div>
      </div>

      <div class="text-center space-y-1">
        <h1 class="text-2xl font-extrabold text-slate-900 dark:text-white">Forgot Password?</h1>
        <p class="text-xs text-slate-500">Enter your account email to receive a password reset link.</p>
      </div>

      <form class="space-y-4" onsubmit="event.preventDefault(); alert('Password reset link sent to your email!'); window.location.href='login.html';">
        <div>
          <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Email Address</label>
          <input type="email" placeholder="customer@freshbasket.com" required class="w-full p-3 bg-slate-100 dark:bg-slate-900 border-none rounded-xl text-sm dark:text-white focus:ring-2 focus:ring-green-500" />
        </div>

        <button type="submit" class="btn-primary w-full py-3.5 text-sm font-bold shadow-lg shadow-green-600/30">
          Send Reset Link
        </button>
      </form>

      <div class="text-center pt-2">
        <a href="login.html" class="text-xs text-green-600 font-bold hover:underline">← Back to Login</a>
      </div>
    </div>
  </main>

  <footer class="py-6 text-center text-xs text-slate-500 dark:text-slate-400 space-y-1">
    <p>© 2026 FreshBasket Supermarket Inc.</p>
    <div class="text-[11px] flex items-center justify-center gap-2">
      <span>Developed by</span>
      <span class="font-semibold text-slate-700 dark:text-slate-200">Abhivorn Technologies Pvt Ltd</span>
    </div>
  </footer>

  <script src="../assets/js/theme.js"></script>
</body>
</html>
