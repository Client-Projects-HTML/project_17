<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Registration — FreshBasket Supermarket</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg" />
  <link rel="shortcut icon" href="../favicon.svg" />
  <link rel="apple-touch-icon" href="../assets/images/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { 600: '#16a34a' } } } } }
  </script>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/dark-mode.css" />
  <link rel="stylesheet" href="../assets/css/rtl.css" />
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col justify-between transition-colors duration-200">

  <header class="py-2 px-4 max-w-7xl mx-auto w-full flex items-center justify-between">
    <a href="../index.html" class="inline-flex items-center gap-2 px-3.5 py-1.5 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors shadow-sm font-bold text-xs">
      <i class="fa-solid fa-arrow-left text-[11px]"></i>
      <span>Back to Home</span>
    </a>
    <div></div>
  </header>

  <main class="max-w-md mx-auto w-full px-4 py-2 sm:py-3">
    <div class="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 p-5 sm:p-6 shadow-xl space-y-4">
      
      <!-- Card Top Header Controls -->
      <div class="flex items-center justify-between pb-2.5 border-b border-slate-100 dark:border-slate-700/60">
        <div class="flex items-center gap-2">
          <div class="w-6 h-6 bg-green-600 text-white rounded-lg flex items-center justify-center font-extrabold text-[11px] shadow-sm">
            <i class="fa-solid fa-basket-shopping"></i>
          </div>
          <span class="font-extrabold text-xs text-slate-900 dark:text-white">Fresh<span class="text-green-600">Basket</span></span>
        </div>
        <div class="flex items-center gap-1.5">
          <button type="button" onclick="event.preventDefault(); event.stopPropagation(); event.stopImmediatePropagation(); if(window.themeController) window.themeController.toggleDarkMode(); return false;" class="theme-toggle-btn w-7 h-7 flex items-center justify-center bg-slate-100 dark:bg-slate-700/60 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-600 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors" title="Toggle Light/Dark Theme" aria-label="Toggle Light/Dark Theme">
            <i class="fa-solid fa-moon text-[11px]"></i>
          </button>
          <button type="button" onclick="event.preventDefault(); event.stopPropagation(); event.stopImmediatePropagation(); if(window.themeController) window.themeController.toggleRTL(); return false;" class="rtl-toggle-btn w-7 h-7 flex items-center justify-center bg-slate-100 dark:bg-slate-700/60 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-600 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors" title="Toggle RTL/LTR" aria-label="Toggle RTL/LTR">
            <i class="fa-solid fa-right-left text-[11px]"></i>
          </button>
        </div>
      </div>

      <div class="text-center space-y-0.5">
        <h1 id="reg-title" class="text-xl font-extrabold text-slate-900 dark:text-white">Create Your Account</h1>
        <p id="reg-subtitle" class="text-[11px] text-slate-500 dark:text-slate-400">Join FreshBasket to get $15 off your first grocery delivery.</p>
      </div>

      <!-- User Account & Admin Staff Role Tabs -->
      <div class="flex rounded-xl bg-slate-100 dark:bg-slate-900 p-1 border border-slate-200 dark:border-slate-700">
        <button id="reg-tab-user" type="button" onclick="switchRegRole('user')" class="flex-1 py-2 text-xs font-bold rounded-lg transition-all bg-green-600 text-white shadow-md flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-user text-[11px]"></i> User Account
        </button>
        <button id="reg-tab-admin" type="button" onclick="switchRegRole('admin')" class="flex-1 py-2 text-xs font-bold rounded-lg transition-all text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-user-gear text-[11px]"></i> Admin Staff
        </button>
      </div>

      <form id="register-form" class="space-y-3" onsubmit="handleRegisterSubmit(event)">
        
        <!-- 2-column grid for Full Name & Phone Number -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
          <div>
            <label class="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-0.5">Full Name</label>
            <input type="text" placeholder="Geeth Sharma" required class="w-full py-2 px-3 bg-slate-100 dark:bg-slate-900 border-none rounded-xl text-xs dark:text-white focus:ring-2 focus:ring-green-500" />
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-0.5">Phone Number</label>
            <input type="tel" placeholder="(555) 234-5678" required class="w-full py-2 px-3 bg-slate-100 dark:bg-slate-900 border-none rounded-xl text-xs dark:text-white focus:ring-2 focus:ring-green-500" />
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-0.5">Email Address</label>
          <input id="reg-email" type="email" placeholder="customer@freshbasket.com" required class="w-full py-2 px-3 bg-slate-100 dark:bg-slate-900 border-none rounded-xl text-xs dark:text-white focus:ring-2 focus:ring-green-500" />
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-0.5">Password</label>
          <input type="password" placeholder="Create strong password" required class="w-full py-2 px-3 bg-slate-100 dark:bg-slate-900 border-none rounded-xl text-xs dark:text-white focus:ring-2 focus:ring-green-500" />
        </div>

        <div class="flex items-center text-[11px] pt-0.5">
          <label class="flex items-center gap-1.5 cursor-pointer text-slate-600 dark:text-slate-400">
            <input type="checkbox" required checked class="rounded accent-green-600" />
            <span>I agree to Store Policies & Terms</span>
          </label>
        </div>

        <button id="reg-submit-btn" type="submit" class="btn-primary w-full py-2.5 text-xs font-bold shadow-md shadow-green-600/25">
          Create Account & Sign In
        </button>
      </form>

      <div class="text-center pt-2 border-t border-slate-100 dark:border-slate-700/60 flex flex-col gap-1">
        <span class="text-[11px] text-slate-400">Already registered? </span>
        <div class="flex items-center justify-center gap-3 text-xs font-bold">
          <a href="login.html?type=user" class="text-green-600 hover:underline flex items-center gap-1"><i class="fa-solid fa-user text-[10px]"></i> User Login</a>
          <span class="text-slate-300 dark:text-slate-700">•</span>
          <a href="login.html?type=admin" class="text-amber-600 dark:text-amber-400 hover:underline flex items-center gap-1"><i class="fa-solid fa-user-gear text-[10px]"></i> Admin Login</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-3 text-center text-xs text-slate-500 dark:text-slate-400 space-y-0.5">
    <p>© 2026 FreshBasket Supermarket Inc.</p>
    <div class="text-[10px] flex items-center justify-center gap-1.5">
      <span>Developed by</span>
      <span class="font-semibold text-slate-700 dark:text-slate-200">Abhivorn Technologies Pvt Ltd</span>
    </div>
  </footer>

  <script src="../assets/js/theme.js"></script>
  <script>
    let currentRole = 'user';

    function switchRegRole(role) {
      currentRole = role;
      const userTab = document.getElementById('reg-tab-user');
      const adminTab = document.getElementById('reg-tab-admin');
      const title = document.getElementById('reg-title');
      const subtitle = document.getElementById('reg-subtitle');
      const emailInput = document.getElementById('reg-email');
      const submitBtn = document.getElementById('reg-submit-btn');

      if (role === 'admin') {
        adminTab.className = 'flex-1 py-2 text-xs font-bold rounded-lg transition-all bg-amber-500 text-slate-950 shadow-md flex items-center justify-center gap-1.5';
        userTab.className = 'flex-1 py-2 text-xs font-bold rounded-lg transition-all text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white flex items-center justify-center gap-1.5';
        title.textContent = 'Register Admin Account';
        subtitle.textContent = 'Register staff account for store management & operations.';
        if (emailInput && !emailInput.value) emailInput.placeholder = 'admin@freshbasket.com';
        submitBtn.textContent = 'Create Admin Account & Open Portal';
        submitBtn.className = 'btn-accent w-full py-2.5 text-xs font-bold shadow-md shadow-amber-500/20';
      } else {
        userTab.className = 'flex-1 py-2 text-xs font-bold rounded-lg transition-all bg-green-600 text-white shadow-md flex items-center justify-center gap-1.5';
        adminTab.className = 'flex-1 py-2 text-xs font-bold rounded-lg transition-all text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white flex items-center justify-center gap-1.5';
        title.textContent = 'Create Your Account';
        subtitle.textContent = 'Join FreshBasket to get $15 off your first grocery delivery.';
        if (emailInput && !emailInput.value) emailInput.placeholder = 'customer@freshbasket.com';
        submitBtn.textContent = 'Create Account & Sign In';
        submitBtn.className = 'btn-primary w-full py-2.5 text-xs font-bold shadow-md shadow-green-600/30';
      }
    }

    function handleRegisterSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('reg-email').value;
      alert(`Account created successfully for ${email}! Directing to ${currentRole === 'admin' ? 'Admin Portal' : 'Store'}...`);
      if (currentRole === 'admin') {
        window.location.href = '../admin/dashboard.html';
      } else {
        window.location.href = '../index.html';
      }
    }

    // Read URL param ?type=admin
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('type') === 'admin') {
      switchRegRole('admin');
    }
  </script>
</body>
</html>
