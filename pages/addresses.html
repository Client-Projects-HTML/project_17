<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saved Addresses — FreshBasket Supermarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { 600: '#16a34a' } } } } }
  </script>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/dark-mode.css" />
  <link rel="stylesheet" href="../assets/css/rtl.css" />
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 transition-colors duration-200">

  <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 py-4">
    <div class="max-w-7xl mx-auto px-4 flex items-center justify-between">
      <a href="../index.html" class="flex items-center gap-2">
        <div class="w-9 h-9 bg-green-600 text-white rounded-xl flex items-center justify-center font-extrabold text-lg">
          <i class="fa-solid fa-basket-shopping"></i>
        </div>
        <span class="font-extrabold text-xl dark:text-white">Fresh<span class="text-green-600">Basket</span> Addresses</span>
      </a>
      <div class="flex items-center gap-4">
        <button class="rtl-toggle-btn text-xs font-semibold px-2 py-1 bg-slate-200 dark:bg-slate-700 rounded">RTL</button>
        <button class="theme-toggle-btn text-sm p-1"><i class="fa-solid fa-moon"></i></button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-3xl font-extrabold text-slate-900 dark:text-white">Saved Delivery Addresses</h1>
        <p class="text-xs text-slate-500 mt-1">Manage home, office, and family delivery locations.</p>
      </div>
      <button onclick="window.showToast('New address form opened', 'info')" class="btn-primary py-2.5 px-5 text-xs">
        <i class="fa-solid fa-plus mr-1"></i> Add New Address
      </button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="bg-white dark:bg-slate-800 rounded-3xl border-2 border-green-600 p-6 shadow-sm">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-bold text-green-700 bg-green-100 dark:bg-green-950/40 px-2.5 py-0.5 rounded-full uppercase">Default Home</span>
          <i class="fa-solid fa-circle-check text-green-600 text-lg"></i>
        </div>
        <h3 class="font-bold text-slate-900 dark:text-white text-base">Sarah Jenkins</h3>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">742 Evergreen Terrace, Apt 4B<br />Downtown, NY 10001</p>
        <p class="text-xs text-slate-400 mt-2"><i class="fa-solid fa-phone mr-1"></i> (555) 234-5678</p>
      </div>

      <div class="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 p-6 shadow-sm">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-bold text-slate-500 bg-slate-100 dark:bg-slate-700 px-2.5 py-0.5 rounded-full uppercase">Office</span>
        </div>
        <h3 class="font-bold text-slate-900 dark:text-white text-base">Sarah Jenkins (Work)</h3>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">100 Innovation Way, Suite 300<br />Midtown, NY 10018</p>
      </div>
    </div>
  </main>

  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
