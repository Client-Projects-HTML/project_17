<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Methods — FreshBasket Supermarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { 600: '#16a34a' } } } } }
  </script>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/dark-mode.css" />
  <link rel="stylesheet" href="../assets/css/rtl.css" />
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 transition-colors duration-200">

  <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 py-4">
    <div class="max-w-7xl mx-auto px-4 flex items-center justify-between">
      <a href="../index.html" class="flex items-center gap-2">
        <div class="w-9 h-9 bg-green-600 text-white rounded-xl flex items-center justify-center font-extrabold text-lg">
          <i class="fa-solid fa-basket-shopping"></i>
        </div>
        <span class="font-extrabold text-xl dark:text-white">Fresh<span class="text-green-600">Basket</span> Payments</span>
      </a>
      <div class="flex items-center gap-4">
        <button class="rtl-toggle-btn text-xs font-semibold px-2 py-1 bg-slate-200 dark:bg-slate-700 rounded">RTL</button>
        <button class="theme-toggle-btn text-sm p-1"><i class="fa-solid fa-moon"></i></button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-3xl font-extrabold text-slate-900 dark:text-white">Saved Payment Methods</h1>
        <p class="text-xs text-slate-500 mt-1">Securely saved payment cards and digital wallets.</p>
      </div>
      <button onclick="window.showToast('Card entry modal opened', 'info')" class="btn-primary py-2.5 px-5 text-xs">
        <i class="fa-solid fa-plus mr-1"></i> Add New Payment Method
      </button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="bg-gradient-to-r from-slate-900 to-slate-800 text-white rounded-3xl p-6 shadow-xl relative overflow-hidden">
        <div class="flex items-center justify-between mb-8">
          <span class="text-xs font-bold uppercase tracking-widest text-green-400">Default Card</span>
          <i class="fa-brands fa-cc-visa text-3xl"></i>
        </div>
        <div class="font-mono text-lg font-bold tracking-widest mb-4">•••• •••• •••• 8901</div>
        <div class="flex justify-between items-end text-xs">
          <div>
            <span class="text-slate-400 block text-[10px]">CARD HOLDER</span>
            <span class="font-bold uppercase">Sarah Jenkins</span>
          </div>
          <div>
            <span class="text-slate-400 block text-[10px]">EXPIRES</span>
            <span class="font-bold">08/28</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
