<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Sign In — FreshBasket Supermarket</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg" />
  <link rel="shortcut icon" href="../favicon.svg" />
  <link rel="apple-touch-icon" href="../assets/images/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { 600: '#16a34a' } } } } }
  </script>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/dark-mode.css" />
  <link rel="stylesheet" href="../assets/css/rtl.css" />
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col justify-between transition-colors duration-200">

  <!-- HEADER -->
  <header class="py-2 px-4 max-w-7xl mx-auto w-full flex items-center justify-between">
    <a href="../index.html" class="inline-flex items-center gap-2 px-3.5 py-1.5 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors shadow-sm font-bold text-xs">
      <i class="fa-solid fa-arrow-left text-[11px]"></i>
      <span>Back to Home</span>
    </a>
    <div></div>
  </header>

  <!-- FORM CARD -->
  <main class="max-w-md mx-auto w-full px-4 py-2 sm:py-3">
    <div class="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 p-5 sm:p-6 shadow-xl space-y-4">
      
      <!-- Card Top Header Controls -->
      <div class="flex items-center justify-between pb-2.5 border-b border-slate-100 dark:border-slate-700/60">
        <div class="flex items-center gap-2">
          <div class="w-6 h-6 bg-green-600 text-white rounded-lg flex items-center justify-center font-extrabold text-[11px] shadow-sm">
            <i class="fa-solid fa-basket-shopping"></i>
          </div>
          <span class="font-extrabold text-xs text-slate-900 dark:text-white">Fresh<span class="text-green-600">Basket</span></span>
        </div>
        <div class="flex items-center gap-1.5">
          <button type="button" onclick="event.preventDefault(); event.stopPropagation(); event.stopImmediatePropagation(); if(window.themeController) window.themeController.toggleDarkMode(); return false;" class="theme-toggle-btn w-7 h-7 flex items-center justify-center bg-slate-100 dark:bg-slate-700/60 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-600 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors" title="Toggle Light/Dark Theme" aria-label="Toggle Light/Dark Theme">
            <i class="fa-solid fa-moon text-[11px]"></i>
          </button>
          <button type="button" onclick="event.preventDefault(); event.stopPropagation(); event.stopImmediatePropagation(); if(window.themeController) window.themeController.toggleRTL(); return false;" class="rtl-toggle-btn w-7 h-7 flex items-center justify-center bg-slate-100 dark:bg-slate-700/60 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-600 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors" title="Toggle RTL/LTR" aria-label="Toggle RTL/LTR">
            <i class="fa-solid fa-right-left text-[11px]"></i>
          </button>
        </div>
      </div>

      <div class="text-center space-y-0.5">
        <h1 id="login-heading" class="text-xl font-extrabold text-slate-900 dark:text-white">User Login</h1>
        <p id="login-subheading" class="text-[11px] text-slate-500 dark:text-slate-400">Login to access your saved grocery lists, orders, and VIP member perks.</p>
      </div>

      <!-- User Account & Admin Staff Role Tabs -->
      <div class="flex rounded-xl bg-slate-100 dark:bg-slate-900 p-1 border border-slate-200 dark:border-slate-700">
        <button id="tab-user" type="button" onclick="switchLoginTab('user')" class="flex-1 py-2 text-xs font-bold rounded-lg transition-all bg-green-600 text-white shadow-md flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-user text-[11px]"></i> User Account
        </button>
        <button id="tab-admin" type="button" onclick="switchLoginTab('admin')" class="flex-1 py-2 text-xs font-bold rounded-lg transition-all text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-user-gear text-[11px]"></i> Admin Staff
        </button>
      </div>

      <form id="login-form" class="space-y-3" onsubmit="handleLoginSubmit(event)">
        <div>
          <label class="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-0.5">Email Address</label>
          <input id="login-email" type="email" placeholder="customer@freshbasket.com" required
            class="w-full py-2 px-3 bg-slate-100 dark:bg-slate-900 border-none rounded-xl text-xs dark:text-white focus:ring-2 focus:ring-green-500" />
        </div>

        <div>
          <div class="flex items-center justify-between mb-0.5">
            <label class="block text-[11px] font-bold text-slate-700 dark:text-slate-300">Password</label>
            <a href="forgot-password.html" class="text-[11px] text-green-600 font-bold hover:underline">Forgot password?</a>
          </div>
          <input id="login-password" type="password" placeholder="••••••••" required
            class="w-full py-2 px-3 bg-slate-100 dark:bg-slate-900 border-none rounded-xl text-xs dark:text-white focus:ring-2 focus:ring-green-500" />
        </div>

        <div class="flex items-center justify-between text-[11px]">
          <label class="flex items-center gap-1.5 cursor-pointer text-slate-600 dark:text-slate-400">
            <input type="checkbox" checked class="rounded accent-green-600" />
            <span>Remember me</span>
          </label>
        </div>

        <div class="space-y-2 pt-0.5">
          <button id="login-submit-btn" type="submit" class="btn-primary w-full py-2.5 text-xs font-bold shadow-md shadow-green-600/25">
            Login
          </button>

          <a id="go-dashboard-btn" href="../user/index.html" class="flex items-center justify-center gap-1.5 w-full py-2 text-xs font-bold bg-slate-100 dark:bg-slate-700/60 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-100 rounded-xl transition-all border border-slate-200 dark:border-slate-600 shadow-sm">
            <i class="fa-solid fa-gauge-high text-[11px]"></i>
            <span id="go-dashboard-text">Go to Dashboard</span>
          </a>
        </div>
      </form>

      <div id="register-footer-prompt" class="relative text-center border-t border-slate-100 dark:border-slate-700/60 pt-3">
        <span class="text-[11px] text-slate-400">Don't have an account? <a href="register.html" class="text-green-600 font-bold hover:underline">Sign up now</a></span>
      </div>
    </div>
  </main>

  <footer class="py-3 text-center text-xs text-slate-500 dark:text-slate-400 space-y-0.5">
    <p>© 2026 FreshBasket Supermarket Inc.</p>
    <div class="text-[10px] flex items-center justify-center gap-1.5">
      <span>Developed by</span>
      <span class="font-semibold text-slate-700 dark:text-slate-200">Abhivorn Technologies Pvt Ltd</span>
    </div>
  </footer>

  <script src="../assets/js/theme.js"></script>
  <script>
    let activeRole = 'user';

    function switchLoginTab(role) {
      activeRole = role;
      const userBtn = document.getElementById('tab-user');
      const adminBtn = document.getElementById('tab-admin');
      const heading = document.getElementById('login-heading');
      const subheading = document.getElementById('login-subheading');
      const emailInput = document.getElementById('login-email');
      const submitBtn = document.getElementById('login-submit-btn');
      const goDashboardBtn = document.getElementById('go-dashboard-btn');
      const goDashboardText = document.getElementById('go-dashboard-text');

      if (role === 'admin') {
        adminBtn.className = 'flex-1 py-2 text-xs font-bold rounded-lg transition-all bg-amber-500 text-slate-950 shadow-md flex items-center justify-center gap-1.5';
        userBtn.className = 'flex-1 py-2 text-xs font-bold rounded-lg transition-all text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white flex items-center justify-center gap-1.5';
        heading.textContent = 'Admin Portal Login';
        subheading.textContent = 'Login to access inventory, orders, customer management, and analytics.';
        if (emailInput) emailInput.placeholder = 'admin@freshbasket.com';
        submitBtn.textContent = 'Login';
        submitBtn.className = 'btn-accent w-full py-2.5 text-xs font-bold shadow-md shadow-amber-500/20';
        if (goDashboardBtn) goDashboardBtn.href = '../admin/index.html';
        if (goDashboardText) goDashboardText.textContent = 'Go to Admin Dashboard';
      } else {
        userBtn.className = 'flex-1 py-2 text-xs font-bold rounded-lg transition-all bg-green-600 text-white shadow-md flex items-center justify-center gap-1.5';
        adminBtn.className = 'flex-1 py-2 text-xs font-bold rounded-lg transition-all text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white flex items-center justify-center gap-1.5';
        heading.textContent = 'User Login';
        subheading.textContent = 'Login to access your saved grocery lists, orders, and VIP member perks.';
        if (emailInput) emailInput.placeholder = 'customer@freshbasket.com';
        submitBtn.textContent = 'Login';
        submitBtn.className = 'btn-primary w-full py-2.5 text-xs font-bold shadow-md shadow-green-600/30';
        if (goDashboardBtn) goDashboardBtn.href = '../user/index.html';
        if (goDashboardText) goDashboardText.textContent = 'Go to User Dashboard';
      }
    }

    function handleLoginSubmit(event) {
      event.preventDefault();
      if (activeRole === 'admin') {
        window.location.href = '../admin/index.html';
      } else {
        window.location.href = '../user/index.html';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      if (params.get('type') === 'admin') {
        switchLoginTab('admin');
      } else {
        switchLoginTab('user');
      }
    });
  </script>
</body>
</html>
