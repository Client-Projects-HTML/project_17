<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us — FreshBasket Supermarket</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg" />
  <link rel="shortcut icon" href="../favicon.svg" />
  <link rel="apple-touch-icon" href="../assets/images/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { 600: '#16a34a' } } } } }
  </script>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/dark-mode.css" />
  <link rel="stylesheet" href="../assets/css/rtl.css" />
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 transition-colors duration-200">

  <header class="sticky top-0 z-50 w-full shadow-sm bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 py-4 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 flex items-center justify-between">
      <a href="../index.html" class="flex items-center gap-2">
        <div class="w-9 h-9 bg-green-600 text-white rounded-xl flex items-center justify-center font-extrabold text-lg">
          <i class="fa-solid fa-basket-shopping"></i>
        </div>
        <span class="font-extrabold text-xl dark:text-white">Fresh<span class="text-green-600">Basket</span> Contact</span>
      </a>
      <div class="flex items-center gap-3">
        <a href="login.html" id="nav-login-btn" class="inline-flex items-center gap-2 px-3.5 py-1.5 bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-500 hover:to-emerald-500 text-white font-bold text-xs rounded-xl shadow-md transition-all">
          <i class="fa-solid fa-right-to-bracket text-xs"></i>
          <span>Login</span>
        </a>
        <button type="button" onclick="event.preventDefault(); event.stopPropagation(); event.stopImmediatePropagation(); if(window.themeController) window.themeController.toggleRTL(); return false;" class="rtl-toggle-btn w-8 h-8 flex items-center justify-center bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-600 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors" title="Toggle RTL/LTR" aria-label="Toggle RTL/LTR"><i class="fa-solid fa-globe text-sm"></i></button>
        <button class="theme-toggle-btn text-sm p-1"><i class="fa-solid fa-moon"></i></button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
      
      <!-- Contact Info -->
      <div class="lg:col-span-5 space-y-6">
        <div>
          <span class="text-xs font-bold text-green-600 uppercase tracking-widest block mb-1">Customer Care</span>
          <h1 class="text-3xl font-extrabold text-slate-900 dark:text-white">We'd Love To Hear From You</h1>
          <p class="text-xs text-slate-500 mt-2">Have a question about your grocery delivery, store hours, or product availability? Reach out below.</p>
        </div>

        <div class="space-y-4">
          <div class="flex items-center gap-4 p-4 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700">
            <div class="w-10 h-10 bg-green-50 dark:bg-green-950/50 text-green-600 rounded-xl flex items-center justify-center text-lg"><i class="fa-solid fa-phone"></i></div>
            <div>
              <span class="text-xs text-slate-400 font-semibold block">Store Hotline</span>
              <span class="font-bold text-slate-900 dark:text-white text-sm">1-800-FRESH-GROCERY</span>
            </div>
          </div>

          <div class="flex items-center gap-4 p-4 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700">
            <div class="w-10 h-10 bg-green-50 dark:bg-green-950/50 text-green-600 rounded-xl flex items-center justify-center text-lg"><i class="fa-solid fa-envelope"></i></div>
            <div>
              <span class="text-xs text-slate-400 font-semibold block">Email Support</span>
              <span class="font-bold text-slate-900 dark:text-white text-sm">support@freshbasket.com</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Form (Formspree / Netlify Ready) -->
      <div class="lg:col-span-7 bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 p-8 shadow-sm">
        <!-- INTEGRATION PLACEHOLDER: Set action="https://formspree.io/f/YOUR_FORM_ID" or add netlify data attribute -->
        <form id="contact-form" action="#" method="POST" class="space-y-4" onsubmit="event.preventDefault(); window.showToast('Message sent! We will reply within 2 hours.', 'success');">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Your Name</label>
              <input type="text" name="name" required placeholder="Geeth" class="w-full p-3 bg-slate-100 dark:bg-slate-900 border-none rounded-xl text-sm dark:text-white" />
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Email Address</label>
              <input type="email" name="email" required placeholder="geeth@example.com" class="w-full p-3 bg-slate-100 dark:bg-slate-900 border-none rounded-xl text-sm dark:text-white" />
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Subject</label>
            <input type="text" name="subject" required placeholder="Question about organic produce..." class="w-full p-3 bg-slate-100 dark:bg-slate-900 border-none rounded-xl text-sm dark:text-white" />
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Message</label>
            <textarea name="message" rows="4" required placeholder="How can our neighborhood supermarket assist you?" class="w-full p-3 bg-slate-100 dark:bg-slate-900 border-none rounded-xl text-sm dark:text-white"></textarea>
          </div>

          <button type="submit" class="btn-primary w-full py-4 text-sm font-bold shadow-lg shadow-green-600/30">
            Send Message
          </button>
        </form>
      </div>

    </div>
  </main>

  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
