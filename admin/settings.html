<body class="bg-slate-100 dark:bg-slate-900 text-slate-900 dark:text-slate-100 min-h-screen flex">

    <div class="p-6 space-y-6">
      <a href="../index.html" class="flex items-center gap-2.5">
        <div class="w-9 h-9 bg-green-600 text-white rounded-xl flex items-center justify-center font-extrabold text-lg">
          <i class="fa-solid fa-basket-shopping"></i>

        <span class="font-extrabold text-lg text-white">Fresh<span class="text-green-500">Admin</span></span>
      </a>
      <nav class="space-y-1 text-xs font-semibold">
        <a href="index.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white"><i class="fa-solid fa-chart-line text-sm"></i> Dashboard Overview</a>

        <a href="orders.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white"><i class="fa-solid fa-truck-ramp-box text-sm"></i> Orders & Delivery</a>
        <a href="customers.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white"><i class="fa-solid fa-users text-sm"></i> Customers</a>
        <a href="inventory.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white"><i class="fa-solid fa-warehouse text-sm"></i> Inventory Alerts</a>
        <a href="deals.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white"><i class="fa-solid fa-tags text-sm"></i> Weekly Deals</a>

      </nav>
    </div>
  </aside>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-6 py-4 flex items-center justify-between">
      <h1 class="text-xl font-extrabold text-slate-900 dark:text-white">Store Configuration & Integrations</h1>
    </header>

    <main class="p-6 space-y-6 flex-1 overflow-y-auto max-w-4xl">
      
      <!-- Store Settings -->
      <div class="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 p-6 shadow-sm space-y-4">
        <h3 class="font-bold text-slate-900 dark:text-white text-base">Store Profile</h3>
        <form onsubmit="event.preventDefault(); window.showToast('Store settings saved!', 'success');" class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Store Brand Name</label>
              <input type="text" value="FreshBasket Supermarket" class="w-full p-2.5 bg-slate-100 dark:bg-slate-900 border-none rounded-xl text-sm dark:text-white" />
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Delivery Free Threshold ($)</label>
              <input type="number" value="50.00" class="w-full p-2.5 bg-slate-100 dark:bg-slate-900 border-none rounded-xl text-sm dark:text-white" />
            </div>
          </div>
          <button type="submit" class="btn-primary py-2.5 px-6 text-xs font-bold">Save Settings</button>
        </form>
      </div>

      <!-- Integration Placeholders Box -->
      <div class="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 p-6 shadow-sm space-y-4">
        <h3 class="font-bold text-slate-900 dark:text-white text-base">Integration API Keys (Placeholder Ready)</h3>
        <div class="space-y-3 text-xs">
          <!-- TODO: Replace with live Stripe Publishable Key -->
          <div>
            <label class="block font-bold text-slate-600 dark:text-slate-400 mb-1">Stripe Publishable Key</label>
            <input type="text" placeholder="pk_test_sample_stripe_key_placeholder" class="w-full p-2.5 bg-slate-100 dark:bg-slate-900 border-none rounded-xl font-mono dark:text-white" />
          </div>
          <!-- TODO: Replace with Mailchimp API Key -->
          <div>
            <label class="block font-bold text-slate-600 dark:text-slate-400 mb-1">Mailchimp Newsletter API Key</label>
            <input type="text" placeholder="mc_key_placeholder_xyz" class="w-full p-2.5 bg-slate-100 dark:bg-slate-900 border-none rounded-xl font-mono dark:text-white" />
          </div>
          <!-- TODO: Replace with Google Maps API Key -->
          <div>
            <label class="block font-bold text-slate-600 dark:text-slate-400 mb-1">Google Maps API Key</label>
            <input type="text" placeholder="AIzaSy_GoogleMapsKeyPlaceholder" class="w-full p-2.5 bg-slate-100 dark:bg-slate-900 border-none rounded-xl font-mono dark:text-white" />
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/main.js"></script>
