<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Notifications — FreshBasket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { 600: '#16a34a' } } } } }
  </script>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/dark-mode.css" />
  <link rel="stylesheet" href="../assets/css/rtl.css" />
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-900 dark:text-slate-100 min-h-screen flex">

  <aside class="w-64 bg-slate-900 text-slate-300 min-h-screen flex flex-col justify-between hidden md:flex flex-shrink-0">
    <div class="p-6 space-y-6">
      <a href="../index.html" class="flex items-center gap-2.5">
        <div class="w-9 h-9 bg-green-600 text-white rounded-xl flex items-center justify-center font-extrabold text-lg">
          <i class="fa-solid fa-basket-shopping"></i>
        </div>
        <span class="font-extrabold text-lg text-white">Fresh<span class="text-green-500">Admin</span></span>
      </a>
      <nav class="space-y-1 text-xs font-semibold">
        <a href="index.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white"><i class="fa-solid fa-chart-line text-sm"></i> Dashboard Overview</a>
        <a href="products.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white"><i class="fa-solid fa-box text-sm"></i> Products Catalog</a>
        <a href="categories.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white"><i class="fa-solid fa-layer-group text-sm"></i> Categories</a>
        <a href="orders.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white"><i class="fa-solid fa-truck-ramp-box text-sm"></i> Orders & Delivery</a>
        <a href="customers.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white"><i class="fa-solid fa-users text-sm"></i> Customers</a>
        <a href="inventory.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white"><i class="fa-solid fa-warehouse text-sm"></i> Inventory Alerts</a>
        <a href="deals.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white"><i class="fa-solid fa-tags text-sm"></i> Weekly Deals</a>
        <a href="reviews.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white"><i class="fa-solid fa-star text-sm"></i> Product Reviews</a>
        <a href="notifications.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-green-600 text-white shadow-md"><i class="fa-solid fa-bell text-sm"></i> Notifications</a>
        <a href="analytics.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white"><i class="fa-solid fa-chart-pie text-sm"></i> Revenue Analytics</a>
        <a href="settings.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white"><i class="fa-solid fa-gear text-sm"></i> Store Settings</a>
      </nav>
    </div>
  </aside>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-6 py-4 flex items-center justify-between">
      <h1 class="text-xl font-extrabold text-slate-900 dark:text-white">Store Alert Dispatcher</h1>
    </header>

    <main class="p-6 space-y-6 flex-1 overflow-y-auto">
      <div class="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 p-6 shadow-sm space-y-4 max-w-xl">
        <h3 class="font-bold text-slate-900 dark:text-white text-base">Broadcast Alert to Shoppers</h3>
        <form onsubmit="event.preventDefault(); window.showToast('Push alert broadcasted to mobile users!', 'success');" class="space-y-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Notification Title</label>
            <input type="text" required placeholder="Flash Deal: Organic Apples 20% OFF" class="w-full p-2.5 bg-slate-100 dark:bg-slate-900 border-none rounded-xl text-sm dark:text-white" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Message Body</label>
            <textarea rows="3" required placeholder="Order within 30 mins to get fresh apples delivered by noon..." class="w-full p-2.5 bg-slate-100 dark:bg-slate-900 border-none rounded-xl text-sm dark:text-white"></textarea>
          </div>
          <button type="submit" class="btn-primary w-full py-3 text-xs font-bold">Broadcast Push Notification</button>
        </form>
      </div>
    </main>
  </div>

  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
